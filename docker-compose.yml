services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lakehouse_dev
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - lakehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lakehouse_dev"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  app:
    # Explicit image name so Forge can tag/release the compose build artifact.
    # Forge release tagging reads services.app.image and `compose images -q app`.
    image: iam-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-4000}:4000"
      - "${DEMO_HOST_PORT:-4100}:4100"
    environment:
      # Default to dev: the image is compiled for MIX_ENV=dev, and prod runtime
      # rejects the docker-dev secret placeholders below. Set APP_MIX_ENV=prod only
      # when injecting fresh SECRET_KEY_BASE / JWT_SECRET / IAM_ADMIN_PASSWORD.
      MIX_ENV: ${APP_MIX_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-ecto://postgres:postgres@postgres/lakehouse_dev}
      PHX_HOST: ${PHX_HOST:-iam.jeeth.dev}
      IAM_PUBLIC_URL: ${IAM_PUBLIC_URL:-https://iam.jeeth.dev}
      IAM_DOMAIN: ${IAM_DOMAIN:-jeeth.dev}
      # The Compose database stays on its private network. Cloudflare uses verified TLS.
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lakehouse_dev
      PORT: "4000"
      PHX_LISTEN_ADDRESS: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-change-me-in-production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKERdEVDOCKER}
      IAM_ADMIN_USERNAME: ${IAM_ADMIN_USERNAME:-admin}
      IAM_ADMIN_PASSWORD: ${IAM_ADMIN_PASSWORD:-changeme}
      IAM_RELAXED_CALLBACK_URLS: ${IAM_RELAXED_CALLBACK_URLS:-false}
      LAKEHOUSE_MEDIA_ROOT: ${LAKEHOUSE_MEDIA_ROOT:-/var/lib/lakehouse/media}
      # Test-only demo app (not part of default product deploy UX): set LAKEHOUSE_DEMO=1
      LAKEHOUSE_DEMO: ${LAKEHOUSE_DEMO:-}
      DEMO_PORT: ${DEMO_PORT:-4100}
      LAKEHOUSE_IAM_BASE: ${LAKEHOUSE_IAM_BASE:-http://127.0.0.1:4000}
    volumes:
      - lakehouse_media:/var/lib/lakehouse/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lakehouse_pgdata:
    # Bump suffix when init-user/role expectations change; legacy volumes may lack
    # the configured POSTGRES_USER and break psql/ecto with "role does not exist".
    name: ${COMPOSE_PROJECT_NAME:-lakehouse}_pgdata_v2
  lakehouse_media:
    name: ${COMPOSE_PROJECT_NAME:-lakehouse}_media
