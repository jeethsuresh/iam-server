apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iam
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: gravitas
      namespace: gravitas-system
      sectionName: apex-https
  hostnames: [gravitas.cool]
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: iam
          port: 80
