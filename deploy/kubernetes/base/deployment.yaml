apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/component: server
spec:
  # Room actors currently have one owner within a BEAM instance. Do not scale
  # horizontally until distributed ownership and PubSub are implemented.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iam
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam
        app.kubernetes.io/component: server
    spec:
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iam
          image: iam:release
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iam-config
            - secretRef:
                name: iam-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iam-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            timeoutSeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: postgres-ca
          secret:
            secretName: iam-db-ca
            items:
              - key: ca.crt
                path: ca.crt
