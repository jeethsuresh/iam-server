apiVersion: batch/v1
kind: CronJob
metadata:
  name: iam-migrate
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/component: migration
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iam
            app.kubernetes.io/component: migration
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: iam
              image: iam:release
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: iam-config
                - secretRef:
                    name: iam-secrets
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: iam-db-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 100m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: postgres-ca
                  mountPath: /etc/postgres-ca
                  readOnly: true
              command: [/app/bin/lakehouse, eval, "LakehouseIam.Release.migrate()"]
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            - name: postgres-ca
              secret:
                secretName: iam-db-ca
                items:
                  - key: ca.crt
                    path: ca.crt
