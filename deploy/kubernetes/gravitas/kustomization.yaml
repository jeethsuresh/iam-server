apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iam
resources:
  - ../base
  - postgres.yaml
  - media.yaml
  - ingress.yaml
patches:
  - path: app-storage.yaml
  - path: matrix-signing.patch.yaml
  - target:
      kind: ConfigMap
      name: iam-config
    patch: |-
      - op: replace
        path: /data/IAM_EPHEMERAL_DISK
        value: "false"
      - op: add
        path: /data/LAKEHOUSE_MEDIA_ROOT
        value: /var/lib/iam/media
      - op: add
        path: /data/IAM_NATIVE_BROKER_ORIGIN
        value: https://apps.gravitas.cool
      - op: add
        path: /data/MATRIX_RTC_URL
        value: wss://rtc.gravitas.cool
      - op: add
        path: /data/PROTOCOL_OWNERS
        value: '{"appstore":"https://apps.gravitas.cool"}'
      - op: add
        path: /data/PROTOCOL_GATEWAY_ADDR
        value: traefik.traefik.svc.cluster.local:443
