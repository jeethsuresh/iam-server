apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [gravitas.cool]
  rules:
    - host: gravitas.cool
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iam
                port:
                  number: 80
