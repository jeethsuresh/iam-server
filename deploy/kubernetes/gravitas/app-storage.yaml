apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
spec:
  template:
    spec:
      containers:
        - name: iam
          volumeMounts:
            - name: media
              mountPath: /var/lib/iam/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: iam-media
