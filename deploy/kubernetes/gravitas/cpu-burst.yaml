apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
spec:
  template:
    spec:
      containers:
        - name: iam
          resources:
            limits:
              cpu: "1"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iam-db
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            limits:
              cpu: "1"
