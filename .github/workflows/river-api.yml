name: River delegated API
on:
  push:
    branches: [codex/river-groups-events]
  pull_request:
permissions:
  contents: read
concurrency:
  group: river-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test against isolated Postgres
        run: |
          docker run --rm --network host -v "$PWD:/app" -w /app \
            -e MIX_ENV=test -e WALLABY_SKIP=1 -e POSTGRES_HOST=127.0.0.1 \
            -e ERL_FLAGS='+S 2:2 +SDcpu 1 +SDio 1 +A 2' \
            hexpm/elixir:1.18.5-erlang-27.3.4.17-alpine-3.21.7 \
            sh -ec 'apk add --no-cache build-base git imagemagick imagemagick-jpeg; mix local.hex --force; mix local.rebar --force; mix deps.get; mix ecto.create -r LakehouseIam.Repo; mix ecto.migrate -r LakehouseIam.Repo; mix test'
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jeethsuresh/iam-server:${{ github.sha }}
          cache-from: type=gha,scope=iam-release
          cache-to: type=gha,mode=max,scope=iam-release
      - run: echo 'ghcr.io/jeethsuresh/iam-server@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
