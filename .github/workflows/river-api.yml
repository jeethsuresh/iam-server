name: River delegated API
on:
  push:
    branches: [codex/river-groups-events]
  pull_request:
permissions:
  contents: read
concurrency:
  group: river-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isolated browser test environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.tests
          load: true
          tags: iam-tests:ci
          cache-from: type=gha,scope=iam-tests
          cache-to: type=gha,mode=max,scope=iam-tests
      - name: Run unit, API and real-browser tests
        run: >-
          docker run --rm --init --network host --shm-size=256m
          --ulimit nofile=65536:65536
          -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres
          iam-tests:ci
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jeethsuresh/iam-server:${{ github.sha }}
          cache-from: type=gha,scope=iam-release
          cache-to: type=gha,mode=max,scope=iam-release
      - run: echo 'ghcr.io/jeethsuresh/iam-server@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
