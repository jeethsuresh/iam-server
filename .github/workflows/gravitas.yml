name: Gravitas IAM
on:
  push:
    branches: [main, codex/gravitas-dashboard-kubernetes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gravitas-iam-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable IAM release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jeethsuresh/iam-server:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/jeethsuresh/iam-server
          cache-from: type=gha,scope=iam-release
          cache-to: type=gha,mode=max,scope=iam-release
      - name: Record release image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'IAM release image: ghcr.io/jeethsuresh/iam-server@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
